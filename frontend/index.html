    <!-- Strong-but-pragmatic CSP. Adjust if you proxy through a CDN.
         script-src / connect-src / worker-src allowances for cdn.jsdelivr.net
         and huggingface.co are required by @huggingface/transformers (used by
         the in-browser semantic search): it loads ort-wasm-*.mjs from jsDelivr,
         executes the model in WebAssembly (wasm-unsafe-eval), spawns workers
         from blob: URLs, and fetches the model files from huggingface.co /
         Hugging Face's hf.co CDN and Xet-backed storage hosts. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   img-src 'self' data: https:;
                   font-src 'self' https://fonts.gstatic.com;
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                   script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net;
                   worker-src 'self' blob:;
                   connect-src 'self' blob: data: http://localhost:5000 https://api.banidb.com https://cdn.jsdelivr.net https://huggingface.co https://*.huggingface.co https://hf.co https://*.hf.co https://cdn-lfs.huggingface.co https://*.xethub.hf.co;
                   base-uri 'self';
                   form-action 'self';">
